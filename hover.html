<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            transition: all 1s
        
        }
        .box:hover{
            width: 300px;
            height: 300px;
            background-color: blue;
        }
        

        
    </style>
</head>
<body>
    <h1>Hover - Áp dụng các thuộc tính CSS khi hover (hover - sự kiện khi ta di
        chuột vào khối đó)
    </h1>
    <div class="box"></div>
</body>
</html>
